<!doctype html>
<html lang="en" data-theme="port">
<head>
<meta charset="utf-8" />
<base href="/" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Product — VITRINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="src/product-po.css" />
<style>
  html, body { margin: 0; }
  body { background: #FDFDFC; color: #14181A; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

<script src="src/api.jsx"></script>
<script type="text/babel" src="src/data.jsx"></script>
<script type="text/babel" src="src/Bottle.jsx"></script>

<script type="text/babel">
/* ── Palette / type tokens (from Product Detail.dc.html) ── */
const V = {
  paper: "#FDFDFC", ink: "#14181A", teal: "#0C3B34", orange: "#E0511B",
  mist: "#E9EDEC", rule: "#C9CFCD", muted: "#7B8583",
  display: "'Bricolage Grotesque', system-ui, sans-serif",
  body: "'IBM Plex Sans', system-ui, sans-serif",
  mono: "'IBM Plex Mono', ui-monospace, monospace",
};
const PAD = "clamp(18px, 4vw, 60px)";
const money = (n) => (window.fmtLKR ? window.fmtLKR(n) : "LKR " + Number(n || 0).toLocaleString("en-US"));
const calm = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function getProductId() {
  const m = window.location.pathname.match(/^\/product\/([^/?#]+)/i);
  if (m) return decodeURIComponent(m[1]);
  return new URLSearchParams(window.location.search).get("id");
}

/* Fly a little tinted-glass bottle from the case into the header bag. */
function flyToBag(caseEl, bagEl) {
  if (!caseEl || !bagEl || calm() || !caseEl.animate) return;
  const a = caseEl.getBoundingClientRect(), b = bagEl.getBoundingClientRect();
  const h = Math.min(Math.max(a.height * 0.42, 130), 200), w = h * 0.42;
  const x0 = a.left + a.width / 2 - w / 2, y0 = a.top + a.height / 2 - h / 2;
  const dx = b.left + b.width / 2 - (x0 + w / 2), dy = b.top + b.height / 2 - (y0 + h / 2);
  const cap = Math.round(h * 0.16);
  const ghost = document.createElement("div");
  ghost.style.cssText = "position:fixed;z-index:70;pointer-events:none;left:" + x0 + "px;top:" + y0 + "px;width:" + w + "px;height:" + h + "px;filter:drop-shadow(0 22px 26px rgba(12,59,52,0.34));";
  ghost.innerHTML =
    '<div style="position:absolute;left:34%;right:34%;top:0;height:' + cap + 'px;background:linear-gradient(100deg,#1E2A28,#0A0F0E);border:1px solid #000;border-bottom:none;"></div>' +
    '<div style="position:absolute;left:0;right:0;top:' + (cap - 1) + 'px;bottom:0;border:1px solid ' + V.teal + ';border-radius:3px 3px 5px 5px;background:linear-gradient(104deg,rgba(255,255,255,0.96),' + V.teal + '22 46%,rgba(238,242,241,0.9));box-shadow:inset 0 0 0 3px rgba(255,255,255,0.55);overflow:hidden;">' +
      '<div style="position:absolute;left:12%;top:38%;width:76%;height:26%;background:' + V.orange + ';opacity:0.92;"></div>' +
    '</div>';
  document.body.appendChild(ghost);
  const anim = ghost.animate([
    { transform: "translate(0,0) scale(1) rotate(0deg)", opacity: 1, offset: 0 },
    { transform: "translate(" + (dx * 0.08) + "px,-26px) scale(1.1) rotate(-2deg)", opacity: 1, offset: 0.16 },
    { transform: "translate(" + (dx * 0.55) + "px," + (dy * 0.28 - 56) + "px) scale(0.66) rotate(-7deg)", opacity: 1, offset: 0.55 },
    { transform: "translate(" + dx + "px," + dy + "px) scale(0.1) rotate(4deg)", opacity: 0.15, offset: 1 },
  ], { duration: 1000, easing: "cubic-bezier(0.5,0,0.15,1)" });
  anim.onfinish = anim.oncancel = () => ghost.remove();
  setTimeout(() => {
    if (!bagEl.animate) return;
    bagEl.animate([{ transform: "scale(1)" }, { transform: "scale(0.88)", offset: 0.35 }, { transform: "scale(1.18)", offset: 0.62 }, { transform: "scale(1)" }],
      { duration: 600, easing: "cubic-bezier(0.34,1.5,0.6,1)" });
    const ring = document.createElement("div"); const r = bagEl.getBoundingClientRect();
    ring.style.cssText = "position:fixed;z-index:44;pointer-events:none;border:1.5px solid " + V.orange + ";left:" + (r.left - 4) + "px;top:" + (r.top - 4) + "px;width:" + (r.width + 8) + "px;height:" + (r.height + 8) + "px;animation:poRing 0.8s cubic-bezier(0.2,0.8,0.2,1) forwards;";
    document.body.appendChild(ring); setTimeout(() => ring.remove(), 850);
  }, 860);
}

/* ── Header ── */
function Header({ count, bagRef, onBag }) {
  const link = { fontFamily: V.mono, fontSize: 11, letterSpacing: "0.12em" };
  return (
    <header style={{ position: "sticky", top: 0, zIndex: 30, background: "rgba(253,253,252,0.95)", backdropFilter: "blur(8px)", borderBottom: "1px solid " + V.teal, padding: "13px " + PAD, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 24 }}>
      <a href="/" style={{ fontFamily: V.display, fontWeight: 800, fontSize: "clamp(15px,1.7vw,19px)", letterSpacing: "0.04em" }}>VITRINE</a>
      <nav style={{ display: "flex", flexWrap: "wrap", gap: "clamp(14px,2.4vw,32px)", ...link }}>
        <a href="Shop.html">SHOP</a>
        <a href="Shop.html#new=1">NEW IN</a>
        <a href="Shop.html#sale=1">SALE</a>
        <a href="/#brands">BRANDS</a>
        <a href="journal.html">STORIES</a>
      </nav>
      <button ref={bagRef} className="po-bagbtn" onClick={onBag} style={{ ...link, background: "none", border: "none", borderBottom: "1px solid " + V.teal, padding: "0 0 2px", cursor: "pointer", color: V.ink }}>
        BAG ({String(count).padStart(2, "0")})
      </button>
    </header>
  );
}

/* ── Bag drawer ── */
function BagDrawer({ open, bag, freeOver, onClose, onStep }) {
  if (!open) return null;
  const items = bag.items || [];
  const subtotal = bag.subtotal || 0;
  const short = Math.max(0, freeOver - subtotal);
  const pct = Math.min(100, Math.round((subtotal / freeOver) * 100)) + "%";
  const mono = { fontFamily: V.mono };
  return (
    <div>
      <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(12,59,52,0.32)", zIndex: 55, animation: "poScrim 0.3s both" }}></div>
      <aside style={{ position: "fixed", top: 0, right: 0, bottom: 0, width: "min(430px,94vw)", background: V.paper, borderLeft: "1px solid " + V.teal, zIndex: 60, display: "flex", flexDirection: "column", animation: "poDrawer 0.36s cubic-bezier(0.2,0.8,0.2,1) both" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", padding: "20px clamp(18px,3vw,26px)", borderBottom: "1px solid " + V.teal }}>
          <span style={{ fontFamily: V.display, fontWeight: 700, fontSize: 18, letterSpacing: "-0.01em", color: V.teal }}>Your bag</span>
          <button className="po-hover" onClick={onClose} style={{ ...mono, fontSize: 10, letterSpacing: "0.12em", background: "none", border: "none", cursor: "pointer", color: V.muted }}>CLOSE ×</button>
        </div>
        <div style={{ flex: 1, overflowY: "auto", padding: "0 clamp(18px,3vw,26px)" }}>
          {items.length === 0 && <p style={{ fontFamily: V.body, fontWeight: 300, fontSize: 16, color: V.muted, margin: "28px 0 0" }}>Nothing in the bag yet.</p>}
          {items.map((i, n) => (
            <div key={i.lineId} style={{ display: "grid", gridTemplateColumns: "52px 1fr auto", gap: 14, alignItems: "start", borderBottom: "1px solid " + V.mist, padding: "18px 0", animation: "poRise 0.5s cubic-bezier(0.2,0.8,0.2,1) both", animationDelay: (n * 60) + "ms" }}>
              <div style={{ height: 62, background: "linear-gradient(102deg,#FFFFFF," + V.mist + " 58%,#F7FAF9)", border: "1px solid " + V.mist, position: "relative", overflow: "hidden" }}>
                {i.product.image
                  ? <img src={i.product.image} alt="" style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "contain" }} />
                  : <div style={{ position: "absolute", inset: "18% 32%", background: "linear-gradient(96deg,#fff,#DDE4E2 58%,#F4F7F6)", border: "1px solid " + V.rule, borderBottom: "none" }}></div>}
              </div>
              <div>
                <div style={{ fontFamily: V.display, fontWeight: 700, fontSize: 15, letterSpacing: "-0.015em", lineHeight: 1.12, color: V.teal }}>{i.product.name} {i.product.italic}</div>
                <div style={{ fontFamily: V.body, fontWeight: 300, fontSize: 13, color: "#4A4A43", marginTop: 3 }}>{i.product.brandName}</div>
                <div style={{ display: "flex", gap: 12, alignItems: "center", marginTop: 8, fontFamily: V.mono, fontSize: 10, letterSpacing: "0.08em" }}>
                  <button className="po-radd" onClick={() => onStep(i, i.qty - 1)} style={{ background: "none", border: "1px solid " + V.rule, width: 22, height: 22, cursor: "pointer", color: V.ink }}>−</button>
                  <span>{i.qty}</span>
                  <button className="po-radd" onClick={() => onStep(i, i.qty + 1)} style={{ background: "none", border: "1px solid " + V.rule, width: 22, height: 22, cursor: "pointer", color: V.ink }}>+</button>
                </div>
              </div>
              <div style={{ fontFamily: V.mono, fontSize: 11, textAlign: "right", fontVariantNumeric: "tabular-nums" }}>{money(i.lineTotal)}</div>
            </div>
          ))}
        </div>
        <div style={{ borderTop: "1px solid " + V.teal, padding: "clamp(16px,2.4vw,22px) clamp(18px,3vw,26px)" }}>
          <div style={{ display: "flex", justifyContent: "space-between", ...mono, fontSize: 9, letterSpacing: "0.1em", marginBottom: 7 }}>
            <span style={{ color: V.muted }}>{money(subtotal)}</span><span style={{ color: V.orange }}>{money(freeOver)}</span>
          </div>
          <div style={{ height: 3, background: "#DCE4E2", position: "relative", marginBottom: 8 }}>
            <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: pct, background: V.teal, transition: "width 0.6s cubic-bezier(0.2,0.8,0.2,1)" }}></div>
          </div>
          <div style={{ ...mono, fontSize: 10, letterSpacing: "0.08em", color: V.orange, marginBottom: 16 }}>{short > 0 ? money(short) + " TO FREE DELIVERY" : "FREE DELIVERY UNLOCKED"}</div>
          <div style={{ display: "flex", justifyContent: "space-between", ...mono, fontSize: 11, letterSpacing: "0.06em", marginBottom: 16 }}>
            <span>SUBTOTAL</span><span style={{ fontVariantNumeric: "tabular-nums" }}>{money(subtotal)}</span>
          </div>
          <a href="checkout.html" style={{ display: "block", textAlign: "center", background: V.teal, color: V.paper, padding: 15, ...mono, fontSize: 11, letterSpacing: "0.14em", cursor: "pointer" }}>TO THE COUNTER →</a>
        </div>
      </aside>
    </div>
  );
}

/* ── Product page ── */
function PDP() {
  const id = getProductId();
  const [data, setData] = React.useState(null);
  const [error, setError] = React.useState(null);
  const [qty, setQty] = React.useState(1);
  const [added, setAdded] = React.useState(false);
  const [openPanel, setOpenPanel] = React.useState(-1);
  const [bag, setBag] = React.useState({ items: [], subtotal: 0, count: 0 });
  const [bagOpen, setBagOpen] = React.useState(false);
  const [freeOver, setFreeOver] = React.useState(25000);
  const [narrow, setNarrow] = React.useState(false);
  const bagRef = React.useRef(null);
  const caseRef = React.useRef(null);

  const loadBag = () => window.api.get("/api/cart").then(setBag).catch(() => {});

  React.useEffect(() => {
    if (!id) { setError("No product selected."); return; }
    window.api.get("/api/products/" + encodeURIComponent(id)).then(setData).catch(e => setError(e.message || "Product not found"));
    window.api.get("/api/settings").then(s => { const f = Number(s["shipping.free_over_lkr"]); if (f) setFreeOver(f); }).catch(() => {});
    loadBag();
    const onCart = () => loadBag();
    window.addEventListener("cart:changed", onCart);
    const onResize = () => setNarrow(window.innerWidth < 720);
    onResize(); window.addEventListener("resize", onResize);
    return () => { window.removeEventListener("cart:changed", onCart); window.removeEventListener("resize", onResize); };
  }, [id]);

  const addToBag = async () => {
    try {
      await window.api.post("/api/cart/items", { product_id: id, qty });
      flyToBag(caseRef.current, bagRef.current);
      setAdded(true);
      window.dispatchEvent(new CustomEvent("cart:changed"));
      const openAfter = () => { loadBag(); setBagOpen(true); };
      calm() ? openAfter() : setTimeout(openAfter, 860);
    } catch (e) { /* keep the page usable */ }
  };
  const addRelated = async (rid) => {
    try { await window.api.post("/api/cart/items", { product_id: rid, qty: 1 }); await loadBag(); setBagOpen(true); window.dispatchEvent(new CustomEvent("cart:changed")); } catch {}
  };
  const stepLine = async (line, next) => {
    try {
      if (next <= 0) await window.api.del("/api/cart/items/" + line.lineId);
      else await window.api.patch("/api/cart/items/" + line.lineId, { qty: next });
      await loadBag(); window.dispatchEvent(new CustomEvent("cart:changed"));
    } catch {}
  };

  const mono = { fontFamily: V.mono };

  if (error) {
    return (
      <div className="po-root" style={{ fontFamily: V.body, background: V.paper, minHeight: "100vh" }}>
        <Header count={bag.count} bagRef={bagRef} onBag={() => setBagOpen(true)} />
        <div style={{ padding: "clamp(60px,12vw,140px) " + PAD, textAlign: "center" }}>
          <div style={{ ...mono, fontSize: 11, letterSpacing: "0.14em", color: V.orange }}>NOT FOUND</div>
          <h1 style={{ fontFamily: V.display, fontWeight: 700, fontSize: "clamp(30px,4vw,52px)", color: V.teal, margin: "14px 0 18px" }}>That piece has wandered off.</h1>
          <p style={{ fontFamily: V.body, fontWeight: 300, color: "#33332E", marginBottom: 28 }}>{error}</p>
          <a href="Shop.html" style={{ ...mono, fontSize: 12, letterSpacing: "0.14em", background: V.teal, color: V.paper, padding: "14px 24px" }}>BACK TO SHOP →</a>
        </div>
      </div>
    );
  }
  if (!data) {
    return (
      <div className="po-root" style={{ fontFamily: V.body, background: V.paper, minHeight: "100vh" }}>
        <Header count={0} bagRef={bagRef} onBag={() => {}} />
        <div style={{ padding: "clamp(80px,16vw,180px) " + PAD, ...mono, fontSize: 12, letterSpacing: "0.16em", color: V.muted }}>LOADING…</div>
      </div>
    );
  }

  const p = data.product;
  const related = data.related || [];
  const b = (typeof BRANDS !== "undefined" && BRANDS[p.brand]) || { name: p.brandName, loc: p.brandLoc };
  const origin = p.brandLoc || b.loc || "";
  const now = p.sale || p.price;
  const mlMatch = (p.size || "").match(/([\d.]+)\s*ml/i);
  const unitLabel = mlMatch ? p.size + " · " + money(Math.round(now / parseFloat(mlMatch[1]))) + " per ml" : (p.size || "");
  const rows = [
    origin && { k: "ORIGIN", v: origin },
    p.size && { k: "SIZE", v: p.size },
    p.category && { k: "CATEGORY", v: p.category },
    b.name && { k: "BRAND", v: b.name },
  ].filter(Boolean);
  const panels = [
    p.notes && p.notes.length && { title: "INGREDIENTS", body: p.notes.join(", ") + "." },
    { title: "DELIVERY & RETURNS", body: "Islandwide delivery in two to four days, free over " + money(freeOver) + ". Unopened returns within fourteen days; opened items exchanged at the counter in Colombo 06." },
  ].filter(Boolean);
  const facts = [
    p.size && { k: "SIZE", v: p.size },
    p.category && { k: "CATEGORY", v: p.category },
    origin && { k: "ORIGIN", v: origin },
    (p.stock > 0) && { k: "IN STOCK", v: String(p.stock) },
  ].filter(Boolean);
  const stockNote = p.stock <= 0 ? "Out of stock" : (p.stock <= 10 ? p.stock + " left, no restock date" : "");

  return (
    <div className="po-root" style={{ fontFamily: V.body, background: V.paper, overflowX: "hidden", "--po-teal": V.teal }}>
      <Header count={bag.count} bagRef={bagRef} onBag={() => setBagOpen(true)} />

      {/* breadcrumb */}
      <div style={{ padding: "12px " + PAD, borderBottom: "1px solid " + V.mist, ...mono, fontSize: 10, letterSpacing: "0.12em", color: V.muted, display: "flex", gap: 8, flexWrap: "wrap" }}>
        <a href="Shop.html">SHOP</a><span>/</span><span>{p.category}</span><span>/</span><span style={{ color: V.ink }}>{p.name} {p.italic}</span>
      </div>

      {/* hero + info */}
      <section style={{ display: "flex", flexWrap: "wrap", alignItems: "stretch", borderBottom: "1px solid " + V.teal }}>
        {/* glass case */}
        <div ref={caseRef} style={{ flex: "1 1 420px", minWidth: "min(100%,320px)", position: "relative", overflow: "hidden", background: "linear-gradient(116deg,#F3F6F5," + V.mist + " 52%,#F7FAF9)", borderRight: "1px solid " + V.teal, minHeight: "clamp(360px,46vw,620px)", display: "flex", alignItems: "flex-end", justifyContent: "center", padding: "clamp(24px,4vw,56px)", boxShadow: "inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -80px 100px -80px rgba(12,59,52,0.18)" }}>
          <div style={{ position: "absolute", left: 0, right: 0, bottom: "16%", height: 1, background: "rgba(12,59,52,0.16)" }}></div>
          {p.image
            ? <img src={p.image} alt="" style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "contain", padding: "clamp(24px,5vw,72px)" }} />
            : <div style={{ width: "62%", maxWidth: 300, marginBottom: "12%" }}><ProductVisual image={p.image} variant={p.variant} brand={b} product={{ name: p.italic }} liquid={p.liquid} liquidTop={p.liquidTop} /></div>}
          <div style={{ position: "absolute", right: "clamp(16px,3vw,40px)", top: "clamp(20px,4vw,48px)", width: "clamp(112px,13vw,152px)", height: "clamp(112px,13vw,152px)", border: "1px solid " + V.orange, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", transform: "rotate(-9deg)" }}>
            <span style={{ ...mono, fontSize: 10, letterSpacing: "0.16em", color: V.orange, textAlign: "center", lineHeight: 1.7, maxWidth: "66%" }}>CLEARED · {(origin || "COLOMBO").toUpperCase()}</span>
          </div>
          <div style={{ position: "absolute", left: "clamp(16px,3vw,40px)", bottom: "clamp(16px,3vw,40px)", ...mono, fontSize: 10, letterSpacing: "0.13em", color: V.muted }}>{(p.size || "").toUpperCase()}{p.sub ? " · " + p.sub.toUpperCase() : ""}</div>
          <div style={{ position: "absolute", top: "-20%", bottom: "-20%", left: "-30%", right: "-30%", pointerEvents: "none", background: "linear-gradient(104deg,transparent 36%,rgba(255,255,255,0.85) 46%,rgba(255,255,255,0.18) 53%,transparent 62%)", animation: "poGlint 12s cubic-bezier(0.5,0,0.5,1) infinite" }}></div>
        </div>

        {/* info */}
        <div style={{ flex: "1 1 420px", minWidth: "min(100%,320px)", padding: "clamp(28px,4vw,64px) " + PAD }}>
          <div style={{ ...mono, fontSize: 11, letterSpacing: "0.14em", color: V.teal }}>{b.name}</div>
          <h1 style={{ fontFamily: V.display, fontWeight: 700, fontSize: "clamp(34px,4.6vw,62px)", lineHeight: 0.94, letterSpacing: "-0.025em", margin: "14px 0 0", maxWidth: "15ch", color: V.teal }}>{p.name} {p.italic}</h1>
          {p.copy && <p style={{ fontFamily: V.body, fontWeight: 300, fontSize: 17, lineHeight: 1.55, margin: "clamp(18px,2.4vw,28px) 0 0", maxWidth: "44ch", color: "#33332E" }}>{p.copy}</p>}

          <div style={{ display: "grid", gridTemplateColumns: "1fr auto", marginTop: "clamp(26px,3.4vw,44px)", ...mono, fontSize: 12 }}>
            {rows.map((r, i) => (
              <React.Fragment key={i}>
                <div style={{ borderTop: "1px solid " + V.rule, padding: "10px 0", color: V.muted, letterSpacing: "0.1em" }}>{r.k}</div>
                <div style={{ borderTop: "1px solid " + V.rule, padding: "10px 0", textAlign: "right", fontVariantNumeric: "tabular-nums" }}>{r.v}</div>
              </React.Fragment>
            ))}
          </div>

          <div style={{ display: "flex", flexWrap: "wrap", alignItems: "baseline", gap: "14px 20px", borderTop: "1px solid " + V.teal, marginTop: "clamp(24px,3vw,36px)", paddingTop: 16 }}>
            <span style={{ fontFamily: V.display, fontWeight: 700, fontSize: "clamp(22px,2.4vw,30px)", letterSpacing: "-0.02em", fontVariantNumeric: "tabular-nums" }}>{money(now)}</span>
            {p.sale && <span style={{ ...mono, fontSize: 12, color: V.muted, textDecoration: "line-through" }}>{money(p.price)}</span>}
            <span style={{ ...mono, fontSize: 11, letterSpacing: "0.12em", color: V.muted }}>{unitLabel}</span>
          </div>

          <div style={{ display: "flex", flexWrap: "wrap", gap: 14, marginTop: 22, alignItems: "stretch" }}>
            <div style={{ display: "flex", alignItems: "center", border: "1px solid " + V.rule, ...mono, fontSize: 13 }}>
              <button className="po-qtybtn" onClick={() => setQty(Math.max(1, qty - 1))} style={{ width: 46, minHeight: 50, background: "none", border: "none", cursor: "pointer", color: V.ink }}>−</button>
              <span style={{ minWidth: 34, textAlign: "center", fontVariantNumeric: "tabular-nums" }}>{String(qty).padStart(2, "0")}</span>
              <button className="po-qtybtn" onClick={() => setQty(Math.min(p.stock || 99, qty + 1))} style={{ width: 46, minHeight: 50, background: "none", border: "none", cursor: "pointer", color: V.ink }}>+</button>
            </div>
            <button className="po-add" onClick={addToBag} disabled={p.stock <= 0} style={{ flex: "1 1 220px", minHeight: 50, background: p.stock <= 0 ? V.muted : V.teal, color: V.paper, border: "none", cursor: p.stock <= 0 ? "not-allowed" : "pointer", ...mono, fontSize: 12, letterSpacing: "0.14em", padding: "0 24px" }}>
              {p.stock <= 0 ? "OUT OF STOCK" : (added ? "IN THE BAG — ADD MORE" : "ADD TO BAG")}
            </button>
          </div>
          <div style={{ ...mono, fontSize: 11, letterSpacing: "0.1em", color: V.orange, marginTop: 14, minHeight: 16 }}>{stockNote}</div>

          <div style={{ marginTop: "clamp(28px,3.6vw,46px)" }}>
            {panels.map((s, i) => (
              <div key={i} style={{ borderTop: "1px solid " + V.rule }}>
                <button className="po-hover" onClick={() => setOpenPanel(openPanel === i ? -1 : i)} style={{ width: "100%", background: "none", border: "none", cursor: "pointer", padding: "16px 0", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 16, ...mono, fontSize: 12, letterSpacing: "0.12em", color: V.ink, textAlign: "left" }}>
                  <span>{s.title}</span><span style={{ color: openPanel === i ? V.orange : V.muted }}>{openPanel === i ? "−" : "+"}</span>
                </button>
                {openPanel === i && <p style={{ fontFamily: V.body, fontWeight: 300, fontSize: 16, lineHeight: 1.6, margin: "0 0 20px", maxWidth: "52ch", color: "#33332E", animation: "poRise 0.25s both" }}>{s.body}</p>}
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* the declaration */}
      {p.copy && (
        <section style={{ display: "flex", flexWrap: "wrap", gap: "clamp(28px,4vw,72px)", padding: "clamp(48px,7vw,104px) " + PAD, borderBottom: "1px solid " + V.mist }}>
          <div style={{ flex: "0 0 auto", ...mono, fontSize: 11, letterSpacing: "0.14em", color: V.teal, paddingTop: 6 }}>THE DECLARATION</div>
          <div style={{ flex: "1 1 420px", minWidth: "min(100%,300px)" }}>
            <p style={{ fontFamily: V.body, fontWeight: 300, fontSize: "clamp(18px,1.8vw,23px)", lineHeight: 1.5, margin: 0, maxWidth: "58ch", color: "#22262A" }}>{p.copy}</p>
            {facts.length > 0 && (
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(160px,1fr))", gap: 1, background: V.rule, border: "1px solid " + V.rule, marginTop: "clamp(28px,3.4vw,44px)" }}>
                {facts.map((f, i) => (
                  <div key={i} style={{ background: V.paper, padding: "clamp(16px,2vw,24px)" }}>
                    <div style={{ fontFamily: V.display, fontWeight: 700, fontSize: "clamp(20px,2.2vw,28px)", letterSpacing: "-0.02em" }}>{f.v}</div>
                    <div style={{ ...mono, fontSize: 10, letterSpacing: "0.12em", color: V.muted, marginTop: 8 }}>{f.k}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </section>
      )}

      {/* related — ledger */}
      {related.length > 0 && (
        <section style={{ padding: "clamp(48px,7vw,104px) " + PAD + " clamp(56px,8vw,112px)" }}>
          <div style={{ display: "flex", flexWrap: "wrap", gap: "10px 24px", alignItems: "baseline", justifyContent: "space-between", borderBottom: "1px solid " + V.teal, paddingBottom: 12 }}>
            <h2 style={{ fontFamily: V.display, fontWeight: 700, fontSize: "clamp(22px,2.6vw,34px)", letterSpacing: "-0.022em", margin: 0, color: V.teal }}>You may also like</h2>
            <a href="/#brands" style={{ ...mono, fontSize: 11, letterSpacing: "0.12em" }}>ALL BRANDS →</a>
          </div>
          <div style={{ ...mono, fontSize: 12 }}>
            {related.map((r) => {
              const rb = (typeof BRANDS !== "undefined" && BRANDS[r.brand]) || { name: r.brandName, loc: r.brandLoc };
              return (
                <div key={r.id} className="po-row" style={{ display: "grid", gridTemplateColumns: "minmax(150px,2.4fr) minmax(90px,1.1fr) minmax(70px,0.7fr) 92px 70px", gap: "6px clamp(12px,2vw,28px)", alignItems: "center", borderBottom: "1px solid " + V.mist, padding: "clamp(15px,1.8vw,20px) 0" }}>
                  <a href={"/product/" + r.id} style={{ fontFamily: V.display, fontWeight: 700, fontSize: "clamp(15px,1.5vw,19px)", letterSpacing: "-0.015em" }}>{r.name} {r.italic}</a>
                  <span style={{ color: V.muted, letterSpacing: "0.1em" }}>{(rb.loc || "").toUpperCase()}</span>
                  <span style={{ color: V.muted }}>{r.size || r.sub}</span>
                  <span style={{ textAlign: "right", fontVariantNumeric: "tabular-nums" }}>{money(r.sale || r.price)}</span>
                  <button className="po-radd" onClick={() => addRelated(r.id)} style={{ justifySelf: "end", ...mono, fontSize: 10, letterSpacing: "0.1em", background: "none", border: "none", borderBottom: "1px solid " + V.rule, padding: "0 0 2px", cursor: "pointer", color: V.muted }}>ADD</button>
                </div>
              );
            })}
          </div>
        </section>
      )}

      {/* footer */}
      <footer style={{ borderTop: "1px solid " + V.teal, padding: "clamp(26px,3vw,40px) " + PAD + " calc(clamp(26px,3vw,40px) + " + (narrow ? "68px" : "0px") + ")", display: "flex", flexWrap: "wrap", gap: "10px 32px", justifyContent: "space-between", ...mono, fontSize: 10, letterSpacing: "0.12em", color: V.muted }}>
        <span>© {new Date().getFullYear()} VITRINE · COLOMBO 06</span>
        <span>EVERY BRAND HERE, WE'VE TRIED</span>
      </footer>

      {/* sticky mobile add bar */}
      {narrow && (
        <div style={{ position: "fixed", left: 0, right: 0, bottom: 0, zIndex: 44, background: "rgba(253,253,252,0.97)", backdropFilter: "blur(8px)", borderTop: "1px solid " + V.teal, padding: "10px " + PAD, display: "flex", alignItems: "center", gap: 14, animation: "poBar 0.4s cubic-bezier(0.2,0.8,0.2,1) both" }}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontFamily: V.display, fontWeight: 700, fontSize: 14, letterSpacing: "-0.015em", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", color: V.teal }}>{p.name} {p.italic}</div>
            <div style={{ ...mono, fontSize: 11, letterSpacing: "0.06em", fontVariantNumeric: "tabular-nums" }}>{money(now)}</div>
          </div>
          <button className="po-add" onClick={addToBag} disabled={p.stock <= 0} style={{ flex: "0 0 auto", minHeight: 46, background: p.stock <= 0 ? V.muted : V.teal, color: V.paper, border: "none", cursor: "pointer", ...mono, fontSize: 11, letterSpacing: "0.12em", padding: "0 22px" }}>{added ? "ADD MORE" : "ADD TO BAG"}</button>
        </div>
      )}

      <BagDrawer open={bagOpen} bag={bag} freeOver={freeOver} onClose={() => setBagOpen(false)} onStep={stepLine} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PDP />);
</script>
</body>
</html>
