<!doctype html>
<html lang="en" data-theme="cabinet">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Checkout — VITRINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="src/styles.css" />
<link rel="stylesheet" href="src/nav.css" />
<link rel="stylesheet" href="src/pages.css" />
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

<script src="src/api.jsx"></script>
<script type="text/babel" src="src/tweaks-panel.jsx"></script>
<script type="text/babel" src="src/Bottle.jsx"></script>
<script type="text/babel" src="src/data.jsx"></script>
<script type="text/babel" src="src/chrome.jsx"></script>
<script type="text/babel" src="src/nav.jsx"></script>
<script type="text/babel" src="src/page-shell.jsx"></script>

<script type="text/babel">
function Checkout() {
  const [cart, setCart] = React.useState({ items: [], subtotal: 0, count: 0 });
  const [me, setMe]     = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [err, setErr]   = React.useState("");
  const [placing, setPlacing] = React.useState(false);
  const [sampleOptions, setSampleOptions] = React.useState([]);
  const [settings, setSettings] = React.useState({});

  const [form, setForm] = React.useState({
    email: "", full_name: "", phone: "",
    line1: "", line2: "", city: "Colombo", postcode: "",
    delivery: "std", payment: "card",
    note: "", gift_wrap: false,
    is_gift: false, gift_recipient: "", gift_message: "", gift_hide_prices: false,
    samples: [],
  });

  React.useEffect(() => {
    window.api.get("/api/settings").then(s => {
      setSettings(s);
      setSampleOptions(Array.isArray(s["checkout.samples"]) ? s["checkout.samples"] : []);
    }).catch(() => {});
    Promise.all([
      window.api.get("/api/cart"),
      window.api.get("/api/auth/me").catch(() => ({ user: null })),
    ]).then(([c, m]) => {
      setCart(c);
      // Begin-checkout analytics: only when there's actually a cart to check out.
      if (c && c.count > 0) window.track && window.track("begin_checkout", { value: c.subtotal, meta: { items: c.items.length } });
      setMe(m.user);
      if (m.user) {
        setForm(f => ({
          ...f,
          email: m.user.email || "",
          full_name: [m.user.first_name, m.user.last_name].filter(Boolean).join(" "),
          phone: m.user.phone || "",
        }));
      }
      setLoading(false);
    });
  }, []);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const toggleSample = (s) => {
    setForm(f => {
      const has = f.samples.includes(s);
      const next = has ? f.samples.filter(x => x !== s) : (f.samples.length < 3 ? [...f.samples, s] : f.samples);
      return { ...f, samples: next };
    });
  };

  const sub = cart.subtotal || 0;
  const freeOver = Number(settings["shipping.free_over_lkr"] ?? 25000);
  const stdRate  = Number(settings["shipping.std_lkr"]       ?? 850);
  const expRate  = Number(settings["shipping.express_lkr"]   ?? 1500);
  const codFeeR  = Number(settings["shipping.cod_fee_lkr"]   ?? 200);
  // "The Key" premium perks: free delivery (waives shipping + COD fee) + standing discount.
  const isPremium = !!(me && me.tier === "premium");
  const discountPct = Number(settings["membership.premium_discount_pct"]) || 0;
  const discount = isPremium ? Math.round(sub * discountPct / 100) : 0;
  const shipping = isPremium ? 0 : (form.delivery === "express" ? expRate : (sub >= freeOver ? 0 : stdRate));
  const codFee   = isPremium ? 0 : (form.payment === "cod" ? codFeeR : 0);
  const total    = sub - discount + shipping + codFee;

  const submit = async (e) => {
    e.preventDefault();
    setErr("");
    if (!cart.items?.length) { setErr("Your bag is empty."); return; }
    setPlacing(true);
    try {
      const { order } = await window.api.post("/api/orders", { ...form });
      window.dispatchEvent(new CustomEvent("cart:changed"));
      window.location.href = "order-confirmation.html?number=" + encodeURIComponent(order.number) + "&email=" + encodeURIComponent(form.email);
    } catch (ex) {
      setErr(ex.message || "Couldn't place order");
      setPlacing(false);
    }
  };

  if (loading) {
    return <PageShell><div className="page-wrap"><div className="cart-empty"><h3>Loading…</h3></div></div></PageShell>;
  }
  if (!cart.items?.length) {
    return (
      <PageShell><div className="page-wrap"><div className="cart-empty">
        <h3>Your bag is <em>empty</em>.</h3>
        <p>Nothing to checkout. Browse the shelf and come back.</p>
        <a className="btn-solid" href="Shop.html">Shop the shelf <span>⟶</span></a>
      </div></div></PageShell>
    );
  }

  return (
    <PageShell>
      <div className="page-wrap">
        <div className="page-head">
          <div className="eyebrow"><span>Step 2 of 3</span></div>
          <h1><em>Checkout</em></h1>
          <p>Hand-wrapped and dispatched from Colombo · 2–4 business days island-wide.</p>
        </div>

        {!me && (
          <div style={{padding:"14px 18px",background:"var(--paper)",border:"1px solid var(--line)",marginBottom:24,fontSize:13,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12}}>
            <span style={{color:"var(--ink-2)"}}>Have an account? <a href={"login.html?next=" + encodeURIComponent("/checkout.html")} style={{color:"var(--wine)",borderBottom:"1px solid currentColor"}}>Sign in</a> to autofill — or check out as a guest below.</span>
          </div>
        )}

        <form onSubmit={submit} className="checkout-grid">
          <div>
            <section className="checkout-section">
              <h3>Contact</h3>
              <div className="grid-2">
                <div className="field"><label>Email</label>
                  <input className="input" type="email" required value={form.email} onChange={e => set("email", e.target.value)} />
                </div>
                <div className="field"><label>Phone</label>
                  <input className="input" required value={form.phone} onChange={e => set("phone", e.target.value)} placeholder="+94 7…" />
                </div>
              </div>
            </section>

            <section className="checkout-section">
              <h3>Shipping</h3>
              <div className="field" style={{marginBottom:14}}>
                <label>Full Name</label>
                <input className="input" required value={form.full_name} onChange={e => set("full_name", e.target.value)} />
              </div>
              <div className="field" style={{marginBottom:14}}>
                <label>Address line 1</label>
                <input className="input" required value={form.line1} onChange={e => set("line1", e.target.value)} placeholder="Street &amp; number" />
              </div>
              <div className="field" style={{marginBottom:14}}>
                <label>Address line 2 <span style={{color:"var(--ink-3)",textTransform:"none",letterSpacing:0}}>(optional)</span></label>
                <input className="input" value={form.line2} onChange={e => set("line2", e.target.value)} placeholder="Apartment, suite, landmark" />
              </div>
              <div className="grid-3">
                <div className="field"><label>City</label>
                  <input className="input" required value={form.city} onChange={e => set("city", e.target.value)} />
                </div>
                <div className="field"><label>Postcode</label>
                  <input className="input" value={form.postcode} onChange={e => set("postcode", e.target.value)} />
                </div>
                <div className="field"><label>Country</label>
                  <input className="input" value="Sri Lanka" disabled />
                </div>
              </div>
            </section>

            <section className="checkout-section">
              <h3>Delivery</h3>
              <div className="opts opts-seg">
                <button type="button" className={"opt" + (form.delivery === "std" ? " active" : "")} onClick={() => set("delivery", "std")}>
                  <span className="name">Island Standard</span>
                  <span className="sub">2–4 business days</span>
                  <span className="price">{sub >= freeOver ? "Free" : window.fmtLKR(stdRate)}</span>
                </button>
                <button type="button" className={"opt" + (form.delivery === "express" ? " active" : "")} onClick={() => set("delivery", "express")}>
                  <span className="name">Express · Colombo</span>
                  <span className="sub">Next business day</span>
                  <span className="price">{window.fmtLKR(expRate)}</span>
                </button>
              </div>
            </section>

            <section className="checkout-section">
              <h3>Payment</h3>
              <div className="opts opts-seg">
                <button type="button" className={"opt" + (form.payment === "card" ? " active" : "")} onClick={() => set("payment", "card")}>
                  <span className="name">Card</span>
                  <span className="sub">Visa · Mastercard · Amex</span>
                  <span className="price">Pay link emailed</span>
                </button>
                <button type="button" className={"opt" + (form.payment === "cod" ? " active" : "")} onClick={() => set("payment", "cod")}>
                  <span className="name">Cash on Delivery</span>
                  <span className="sub">Available island-wide</span>
                  <span className="price">+ LKR 200</span>
                </button>
                <button type="button" className={"opt" + (form.payment === "koko" ? " active" : "")} onClick={() => set("payment", "koko")}>
                  <span className="name">KOKO</span>
                  <span className="sub">3 payments · 0% interest</span>
                  <span className="price">Pay link emailed</span>
                </button>
              </div>
              <p style={{marginTop:10,fontSize:12,color:"var(--ink-3)"}}>You'll receive a secure payment link by email once your order is placed.</p>
            </section>

            {sampleOptions.length > 0 && (
              <section className="checkout-section">
                <h3>Free samples <span style={{fontSize:12,color:"var(--ink-3)",fontFamily:"var(--font-sans)",letterSpacing:0}}>(pick up to 3)</span></h3>
                <div className="opts" style={{gridTemplateColumns:"repeat(auto-fit, minmax(220px, 1fr))"}}>
                  {sampleOptions.map(s => (
                    <button type="button" key={s} className={"opt" + (form.samples.includes(s) ? " active" : "")} onClick={() => toggleSample(s)}>
                      <span className="name">{s}</span>
                    </button>
                  ))}
                </div>
              </section>
            )}

            <section className="checkout-section">
              <h3>Gifting</h3>
              <label className="toggle" style={{marginBottom: form.is_gift ? 16 : 0}}>
                <input type="checkbox" checked={form.is_gift} onChange={e => set("is_gift", e.target.checked)} />
                This is a gift
              </label>
              {form.is_gift && (
                <div style={{borderLeft:"2px solid var(--gold, #b08b4f)", paddingLeft:18, marginTop:4}}>
                  <div className="field">
                    <label>Who's it for? <span style={{color:"var(--ink-3)"}}>(optional)</span></label>
                    <input className="input" value={form.gift_recipient} onChange={e => set("gift_recipient", e.target.value)} placeholder="Recipient's name" />
                  </div>
                  <div className="field">
                    <label>A note on the card <span style={{color:"var(--ink-3)"}}>(we write it by hand)</span></label>
                    <textarea value={form.gift_message} onChange={e => set("gift_message", e.target.value)} maxLength="600" placeholder="Happy birthday, from us both…"></textarea>
                  </div>
                  <label className="toggle" style={{marginBottom:12}}>
                    <input type="checkbox" checked={form.gift_wrap} onChange={e => set("gift_wrap", e.target.checked)} />
                    Hand-wrap it (complimentary)
                  </label>
                  <label className="toggle">
                    <input type="checkbox" checked={form.gift_hide_prices} onChange={e => set("gift_hide_prices", e.target.checked)} />
                    Include a gift receipt <span style={{color:"var(--ink-3)", marginLeft:4}}>— no prices in the box</span>
                  </label>
                </div>
              )}
              {!form.is_gift && (
                <label className="toggle" style={{marginTop:14}}>
                  <input type="checkbox" checked={form.gift_wrap} onChange={e => set("gift_wrap", e.target.checked)} />
                  Hand-wrap as a gift (complimentary)
                </label>
              )}
              <div className="field" style={{marginTop:18}}>
                <label>Order note</label>
                <textarea value={form.note} onChange={e => set("note", e.target.value)} placeholder="Anything we should know? (e.g. leave with concierge)"></textarea>
              </div>
            </section>

            {err && <div className="auth-error" style={{margin:"10px 0"}}>{err}</div>}
            <button type="submit" className="btn-solid" disabled={placing} style={{width:"100%",justifyContent:"center",padding:"16px 22px",marginTop:18}}>
              {placing ? "Placing…" : <>Place Order <span>⟶</span></>}
            </button>
          </div>

          <aside className="cart-summary">
            <h3>Order Summary</h3>
            {cart.items.map(line => {
              const it = line.product;
              const b = (BRANDS && BRANDS[it.brand]) || { name: it.brandName };
              return (
                <div key={line.lineId} style={{display:"grid",gridTemplateColumns:"56px 1fr auto",gap:12,alignItems:"center",padding:"10px 0",borderBottom:"1px dashed var(--line)"}}>
                  <div className="mini-stage"><ProductVisual image={it.image} variant={it.variant} brand={b} product={{name:it.italic}} liquid={it.liquid} liquidTop={it.liquidTop}/></div>
                  <div>
                    <div style={{fontSize:10.5,letterSpacing:"0.18em",textTransform:"uppercase",color:"var(--ink-2)"}}>{b.name}</div>
                    <div style={{fontFamily:"var(--font-display)",fontSize:16,lineHeight:1.15}}>{it.name} <em style={{fontFamily:"var(--font-serif)",fontStyle:"italic",color:"var(--wine)"}}>{it.italic}</em></div>
                    <div style={{fontSize:11,color:"var(--ink-3)"}}>{line.size || it.size} · ×{line.qty}</div>
                  </div>
                  <div style={{fontFamily:"var(--font-display)",fontSize:16}}>{window.fmtLKR(line.lineTotal)}</div>
                </div>
              );
            })}
            <div className="row"><span>Subtotal</span><b>{window.fmtLKR(sub)}</b></div>
            {isPremium && discount > 0 && <div className="row"><span>The Key · {discountPct}% off</span><b style={{color:"var(--teal)"}}>−{window.fmtLKR(discount)}</b></div>}
            <div className="row"><span>Delivery{isPremium ? " · The Key" : ""}</span><b>{shipping === 0 ? "Free" : window.fmtLKR(shipping)}</b></div>
            {codFee > 0 && <div className="row"><span>COD fee</span><b>{window.fmtLKR(codFee)}</b></div>}
            <div className="row grand"><span>Total</span><b>{window.fmtLKR(total)}</b></div>
            <div className="cart-note">By placing this order you agree to our delivery &amp; return policy.</div>
          </aside>
        </form>
      </div>
    </PageShell>
  );
}

mountPage(Checkout);
</script>
</body>
</html>
