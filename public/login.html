<!doctype html>
<html lang="en" data-theme="cabinet">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign In — VITRINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="src/styles.css" />
<link rel="stylesheet" href="src/nav.css" />
<link rel="stylesheet" href="src/pages.css" />
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

<script src="src/api.jsx"></script>
<script type="text/babel" src="src/tweaks-panel.jsx"></script>
<script type="text/babel" src="src/Bottle.jsx"></script>
<script type="text/babel" src="src/data.jsx"></script>
<script type="text/babel" src="src/chrome.jsx"></script>
<script type="text/babel" src="src/nav.jsx"></script>
<script type="text/babel" src="src/page-shell.jsx"></script>

<script type="text/babel">
function LoginPage() {
  const [email, setEmail] = React.useState("");
  const [password, setPassword] = React.useState("");
  const [err, setErr] = React.useState("");
  const [busy, setBusy] = React.useState(false);
  const next = new URLSearchParams(window.location.search).get("next") || "account.html";

  const submit = async (e) => {
    e.preventDefault();
    setErr(""); setBusy(true);
    try {
      await window.api.post("/api/auth/login", { email, password });
      window.location.href = next;
    } catch (ex) {
      setErr(ex.message || "Couldn't sign in");
      setBusy(false);
    }
  };

  return (
    <PageShell>
      <div className="auth-wrap">
        <div className="eyebrow"><span>Member · Since 1998</span></div>
        <h1>Welcome <em>back</em>.</h1>
        <p className="sub">Sign in to access your orders, wishlist, and saved addresses.</p>
        <div className="auth-card">
          <form onSubmit={submit}>
            {err && <div className="auth-error">{err}</div>}
            <div className="field"><label>Email</label>
              <input className="input" type="email" required value={email} onChange={e => setEmail(e.target.value)} autoFocus />
            </div>
            <div className="field"><label>Password</label>
              <input className="input" type="password" required value={password} onChange={e => setPassword(e.target.value)} />
            </div>
            <button className="btn-solid" disabled={busy}>{busy ? "Signing in…" : <>Sign In <span>⟶</span></>}</button>
          </form>
          <div className="alt">
            New here? <a href={"signup.html?next=" + encodeURIComponent(next)}>Create an account</a>
          </div>
        </div>
      </div>
    </PageShell>
  );
}

mountPage(LoginPage);
</script>
</body>
</html>
