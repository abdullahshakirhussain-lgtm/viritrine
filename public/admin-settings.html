<!doctype html>
<html lang="en" data-theme="ceylon">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Site Settings — VITRINE Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="src/styles.css" />
<link rel="stylesheet" href="src/pages.css" />
<link rel="stylesheet" href="src/admin.css" />
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="src/api.jsx"></script>
<script type="text/babel" src="src/admin-shell.jsx"></script>

<script type="text/babel">
function SettingsAdmin() {
  const [s, setS] = React.useState(null);
  const [err, setErr] = React.useState("");
  const [saved, setSaved] = React.useState(false);
  const [busy, setBusy] = React.useState(false);

  React.useEffect(() => { window.api.get("/api/admin/settings").then(setS); }, []);

  const set = (k, v) => setS(prev => ({ ...prev, [k]: v }));
  const setNum = (k, v) => set(k, v === "" ? 0 : Number(v));

  const submit = async (e) => {
    e.preventDefault(); setErr(""); setSaved(false); setBusy(true);
    try {
      // Parse samples textarea back to array
      const out = { ...s };
      if (typeof out["checkout.samples"] === "string") {
        out["checkout.samples"] = out["checkout.samples"].split("\n").map(x => x.trim()).filter(Boolean);
      }
      await window.api.patch("/api/admin/settings", out);
      setSaved(true);
      setTimeout(() => setSaved(false), 2400);
    } catch (ex) { setErr(ex.message); }
    finally { setBusy(false); }
  };

  if (!s) return <AdminShell active="settings" title="Settings"><p>Loading…</p></AdminShell>;
  const samples = Array.isArray(s["checkout.samples"]) ? s["checkout.samples"].join("\n") : (s["checkout.samples"] || "");

  return (
    <AdminShell active="settings" eyebrow="Site-wide configuration" title={<>Site <em>settings</em></>}>
      {err && <div className="auth-error" style={{marginBottom:18}}>{err}</div>}
      {saved && <div style={{padding:"10px 14px",background:"color-mix(in oklab, var(--teal) 12%, transparent)",color:"var(--teal)",marginBottom:18,fontSize:12,letterSpacing:"0.18em",textTransform:"uppercase"}}>Saved ✓</div>}

      <form onSubmit={submit}>
        <section className="form-section">
          <h3>Shop <em>identity</em></h3>
          <div className="form-grid-2">
            <div className="field"><label>Shop name</label><input className="input" value={s["site.name"] || ""} onChange={e => set("site.name", e.target.value)} /></div>
            <div className="field"><label>Tagline</label><input className="input" value={s["site.tagline"] || ""} onChange={e => set("site.tagline", e.target.value)} /></div>
          </div>
          <div className="field" style={{marginTop:14}}><label>Founded (year)</label><input className="input" value={s["site.founded"] || ""} onChange={e => set("site.founded", e.target.value)} style={{maxWidth:120}} /></div>
          <div className="field" style={{marginTop:14}}><label>Footer description</label><textarea value={s["site.footer_blurb"] || ""} onChange={e => set("site.footer_blurb", e.target.value)} style={{minHeight:100}}></textarea></div>
        </section>

        <section className="form-section">
          <h3>Contact <em>details</em></h3>
          <div className="form-grid-2">
            <div className="field"><label>Address line 1</label><input className="input" value={s["site.address_line1"] || ""} onChange={e => set("site.address_line1", e.target.value)} /></div>
            <div className="field"><label>Address line 2</label><input className="input" value={s["site.address_line2"] || ""} onChange={e => set("site.address_line2", e.target.value)} /></div>
          </div>
          <div className="form-grid-2" style={{marginTop:14}}>
            <div className="field"><label>Phone</label><input className="input" value={s["site.phone"] || ""} onChange={e => set("site.phone", e.target.value)} /></div>
            <div className="field"><label>Email</label><input className="input" type="email" value={s["site.email"] || ""} onChange={e => set("site.email", e.target.value)} /></div>
          </div>
          <div className="form-grid-3" style={{marginTop:14}}>
            <div className="field"><label>Instagram URL</label><input className="input" value={s["site.instagram"] || ""} onChange={e => set("site.instagram", e.target.value)} /></div>
            <div className="field"><label>Pinterest URL</label><input className="input" value={s["site.pinterest"] || ""} onChange={e => set("site.pinterest", e.target.value)} /></div>
            <div className="field"><label>WhatsApp URL</label><input className="input" value={s["site.whatsapp"] || ""} onChange={e => set("site.whatsapp", e.target.value)} /></div>
          </div>
        </section>

        <section className="form-section">
          <h3>Newsletter <em>copy</em></h3>
          <div className="form-grid-2">
            <div className="field"><label>Heading</label><input className="input" value={s["newsletter.heading"] || ""} onChange={e => set("newsletter.heading", e.target.value)} placeholder="The Monthly Letter." /></div>
            <div className="field"><label>Italic word (highlighted)</label><input className="input" value={s["newsletter.heading_em"] || ""} onChange={e => set("newsletter.heading_em", e.target.value)} placeholder="Monthly" /></div>
          </div>
          <div className="field" style={{marginTop:14}}><label>Body text</label><textarea value={s["newsletter.body"] || ""} onChange={e => set("newsletter.body", e.target.value)} style={{minHeight:80}}></textarea></div>
          <p style={{color:"var(--ink-3)",fontSize:11,margin:"8px 0 0"}}>The italic word appears as the highlighted display-serif portion of the heading. The rest renders in the regular display face.</p>
        </section>

        <section className="form-section">
          <h3>Shipping <em>rates</em> (LKR)</h3>
          <div className="form-grid-2">
            <div className="field"><label>Free delivery threshold</label><input className="input" type="number" min="0" value={s["shipping.free_over_lkr"] || 0} onChange={e => setNum("shipping.free_over_lkr", e.target.value)} /></div>
            <div className="field"><label>Island standard rate</label><input className="input" type="number" min="0" value={s["shipping.std_lkr"] || 0} onChange={e => setNum("shipping.std_lkr", e.target.value)} /></div>
          </div>
          <div className="form-grid-2" style={{marginTop:14}}>
            <div className="field"><label>Express (Colombo) rate</label><input className="input" type="number" min="0" value={s["shipping.express_lkr"] || 0} onChange={e => setNum("shipping.express_lkr", e.target.value)} /></div>
            <div className="field"><label>Cash on Delivery fee</label><input className="input" type="number" min="0" value={s["shipping.cod_fee_lkr"] || 0} onChange={e => setNum("shipping.cod_fee_lkr", e.target.value)} /></div>
          </div>
        </section>

        <section className="form-section">
          <h3>Membership — <em>The Key</em></h3>
          <p style={{color:"var(--ink-3)",fontSize:12,margin:"0 0 14px"}}>Premium members (invited via <a href="admin-members.html">Members</a>) always get free delivery, plus this discount. Eligibility is offered once a customer's lifetime spend passes the threshold.</p>
          <div className="form-grid-2">
            <div className="field"><label>Eligibility threshold (lifetime LKR)</label><input className="input" type="number" min="0" value={s["membership.premium_threshold_lkr"] || 0} onChange={e => setNum("membership.premium_threshold_lkr", e.target.value)} /></div>
            <div className="field"><label>Premium discount (%)</label><input className="input" type="number" min="0" max="100" value={s["membership.premium_discount_pct"] || 0} onChange={e => setNum("membership.premium_discount_pct", e.target.value)} /></div>
          </div>
        </section>

        <section className="form-section">
          <h3>SEO &amp; <em>sharing</em></h3>
          <p style={{color:"var(--ink-3)",fontSize:12,margin:"0 0 14px"}}>What search engines and social previews show for your homepage and pages without their own meta. Per-page meta (e.g. on a product or journal post) overrides these.</p>

          <div className="field" style={{marginBottom:14}}>
            <label>Site description <span style={{textTransform:"none",color:"var(--ink-3)",letterSpacing:0}}>(≤ 160 chars)</span></label>
            <textarea value={s["seo.description"] || ""} onChange={e => set("seo.description", e.target.value)} maxLength={300} style={{minHeight:70}}></textarea>
            <small style={{color:"var(--ink-3)",fontSize:11,marginTop:4}}>{(s["seo.description"] || "").length} chars</small>
          </div>

          <div className="form-grid-2">
            <div className="field">
              <label>Twitter handle <span style={{textTransform:"none",color:"var(--ink-3)",letterSpacing:0}}>(without @)</span></label>
              <input className="input" value={s["seo.twitter"] || ""} onChange={e => set("seo.twitter", e.target.value.replace(/^@/, ""))} placeholder="vitrine_lk" />
            </div>
            <div className="field">
              <label>Allow search engines</label>
              <label className="toggle" style={{marginTop:10}}>
                <input type="checkbox" checked={s["seo.allow_indexing"] !== false} onChange={e => set("seo.allow_indexing", e.target.checked)} />
                Indexable (robots.txt allows crawling)
              </label>
            </div>
          </div>

          <div style={{marginTop:18}}>
            <label className="fld" style={{display:"block",marginBottom:8}}>Default Open Graph image <span style={{textTransform:"none",color:"var(--ink-3)",letterSpacing:0}}>(1200×630 recommended)</span></label>
            <div style={{display:"flex",gap:14,alignItems:"flex-start"}}>
              <div style={{width:200,aspectRatio:"1200/630",background:"var(--bg-2)",border:"1px solid var(--line)",display:"grid",placeItems:"center",overflow:"hidden"}}>
                {s["seo.og_image"] ? <img src={s["seo.og_image"]} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}} /> : <span style={{fontSize:10,letterSpacing:"0.22em",textTransform:"uppercase",color:"var(--ink-3)"}}>No image</span>}
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:8,flex:1}}>
                <label className="btn-solid" style={{cursor:"pointer",alignSelf:"flex-start",padding:"10px 18px"}}>
                  {s["seo.og_image"] ? "Replace OG image" : "Upload OG image"}
                  <input type="file" accept="image/*" style={{display:"none"}}
                         onChange={async e => {
                           const file = e.target.files[0]; if (!file) return;
                           const form = new FormData(); form.append("image", file);
                           const res = await fetch("/api/admin/upload/seo", { method: "POST", credentials: "include", body: form });
                           const d = await res.json();
                           if (d.ok) { set("seo.og_image", d.url); }
                           else { alert(d.error || "Upload failed"); }
                         }} />
                </label>
                {s["seo.og_image"] && <button type="button" className="btn-ghost" onClick={() => set("seo.og_image", "")} style={{alignSelf:"flex-start"}}>Remove</button>}
                <span style={{fontSize:11,color:"var(--ink-3)"}}>Shown when your site is shared on Facebook, LinkedIn, WhatsApp, etc.</span>
              </div>
            </div>
          </div>
        </section>

        <section className="form-section">
          <h3>Free <em>samples</em></h3>
          <p style={{color:"var(--ink-3)",fontSize:12,margin:"0 0 14px"}}>Customers pick up to 3 at checkout. One per line.</p>
          <div className="field"><textarea value={samples} onChange={e => set("checkout.samples", e.target.value)} style={{minHeight:160,fontFamily:"var(--font-sans)"}}></textarea></div>
        </section>

        <button type="submit" className="btn-solid" disabled={busy} style={{padding:"14px 28px"}}>
          {busy ? "Saving…" : "Save all settings"}
        </button>
      </form>
    </AdminShell>
  );
}

mountAdmin(SettingsAdmin);
</script>
</body>
</html>
