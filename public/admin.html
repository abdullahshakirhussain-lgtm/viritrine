<!doctype html>
<html lang="en" data-theme="ceylon">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — VITRINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="src/styles.css" />
<link rel="stylesheet" href="src/pages.css" />
<link rel="stylesheet" href="src/admin.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

<script src="src/api.jsx"></script>
<script type="text/babel" src="src/admin-shell.jsx"></script>

<script type="text/babel">
// Owned-analytics panel — funnel, top products, viewed-together pairs, KPIs.
// Reads /api/admin/analytics for the selected date range (7/30/90 days).
function Analytics() {
  const [range, setRange] = React.useState(30);
  const [data, setData] = React.useState(null);
  const [loading, setLoading] = React.useState(true);

  React.useEffect(() => {
    setLoading(true);
    window.api.get("/api/admin/analytics?range=" + range).then(d => { setData(d); setLoading(false); }).catch(() => setLoading(false));
  }, [range]);

  const maxFunnel = data && data.funnel.length ? Math.max(1, data.funnel[0].count) : 1;

  return (
    <div className="form-section">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
        <h3>Store <em>analytics</em></h3>
        <div style={{display:"flex",gap:6}}>
          {[7,30,90].map(r => (
            <button key={r} type="button" className={r === range ? "btn-solid" : "btn-ghost"}
                    style={{padding:"6px 14px",fontSize:12}} onClick={() => setRange(r)}>{r}d</button>
          ))}
        </div>
      </div>

      {loading && <p style={{color:"var(--ink-2)"}}>Loading…</p>}
      {!loading && !data && <p style={{color:"var(--ink-2)"}}>No analytics yet.</p>}

      {!loading && data && (
        <div>
          {/* KPI row */}
          <div className="stat-grid" style={{marginTop:6}}>
            <div className="stat-card"><div className="l">Sessions ({range}d)</div><div className="v">{data.totals.sessions}</div></div>
            <div className="stat-card"><div className="l">WhatsApp clicks</div><div className="v">{data.totals.whatsapp}</div></div>
            <div className="stat-card"><div className="l">Known customers</div><div className="v">{data.knownCustomers}</div></div>
            <div className="stat-card"><div className="l">Repeat customers</div><div className="v">{data.repeatCustomers}</div></div>
          </div>

          {/* Funnel */}
          <div style={{marginTop:22}}>
            <div style={{fontSize:11,letterSpacing:"0.2em",textTransform:"uppercase",color:"var(--ink-2)",marginBottom:12}}>Conversion funnel</div>
            {data.funnel.map(s => (
              <div key={s.type} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}>
                  <span>{s.label}</span>
                  <span><b>{s.count}</b>{s.dropoff != null && <em style={{color:"var(--ink-3)",fontSize:12}}> · {s.dropoff}% drop-off</em>}</span>
                </div>
                <div style={{height:8,background:"var(--line)",borderRadius:4,overflow:"hidden"}}>
                  <div style={{height:"100%",width:(Math.round((s.count/maxFunnel)*100))+"%",background:"var(--wine)"}}></div>
                </div>
              </div>
            ))}
          </div>

          {/* Top products */}
          <div style={{marginTop:24}}>
            <div style={{fontSize:11,letterSpacing:"0.2em",textTransform:"uppercase",color:"var(--ink-2)",marginBottom:8}}>Top products</div>
            {data.top.length === 0 ? <p style={{color:"var(--ink-3)",fontSize:13}}>No product views in this range.</p> : (
              <div className="dt-wrap"><table className="dt">
                <thead><tr><th>Product</th><th className="num">Views</th><th className="num">Cart-adds</th><th className="num">View→Cart</th></tr></thead>
                <tbody>
                  {data.top.map(p => (
                    <tr key={p.productId}>
                      <td><b>{p.name}</b> <span style={{color:"var(--ink-3)",fontSize:12}}>{p.brand}</span></td>
                      <td className="num">{p.views}</td>
                      <td className="num">{p.carts}</td>
                      <td className="num">{p.conversion}%</td>
                    </tr>
                  ))}
                </tbody>
              </table></div>
            )}
          </div>

          {/* Frequently viewed together */}
          {data.pairs.length > 0 && (
            <div style={{marginTop:24}}>
              <div style={{fontSize:11,letterSpacing:"0.2em",textTransform:"uppercase",color:"var(--ink-2)",marginBottom:8}}>Frequently viewed together <span style={{textTransform:"none",letterSpacing:0,color:"var(--ink-3)"}}>· bundle ideas</span></div>
              {data.pairs.map((p, i) => (
                <div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:13,padding:"6px 0",borderBottom:"1px solid var(--line)"}}>
                  <span>{p.a} <span style={{color:"var(--ink-3)"}}>＋</span> {p.b}</span>
                  <span style={{color:"var(--ink-2)"}}>{p.count} session{p.count === 1 ? "" : "s"}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function Dashboard() {
  const [stats, setStats] = React.useState(null);
  React.useEffect(() => {
    window.api.get("/api/admin/stats").then(setStats);
  }, []);

  if (!stats) return <AdminShell active="dashboard" title="Dashboard"><p>Loading…</p></AdminShell>;

  return (
    <AdminShell active="dashboard" eyebrow="At a glance" title={<>Welcome <em>back</em>.</>}>
      <div className="stat-grid">
        <div className="stat-card"><div className="l">Revenue</div><div className="v">{adminFmtMoney(stats.revenue)}</div></div>
        <div className="stat-card"><div className="l">Orders</div><div className="v">{stats.orders} <em>· {stats.pending} open</em></div></div>
        <div className="stat-card"><div className="l">Products</div><div className="v">{stats.products}</div></div>
        <div className="stat-card"><div className="l">Brands</div><div className="v">{stats.brands}</div></div>
        <div className="stat-card"><div className="l">Customers</div><div className="v">{stats.users}</div></div>
        <div className="stat-card"><div className="l">Newsletter</div><div className="v">{stats.newsletter}</div></div>
        <div className="stat-card"><div className="l">Messages</div><div className="v">{stats.messages}</div></div>
      </div>

      <Analytics />

      <div className="form-section">
        <h3>Recent <em>orders</em></h3>
        {stats.recentOrders.length === 0 ? (
          <div className="empty-admin"><h3>No orders yet</h3><p>Orders will land here as they come in.</p></div>
        ) : (
          <div className="dt-wrap">
            <table className="dt">
              <thead><tr><th>Order</th><th>Customer</th><th>Status</th><th>Date</th><th className="num">Total</th><th></th></tr></thead>
              <tbody>
                {stats.recentOrders.map(o => (
                  <tr key={o.id}>
                    <td><b>{o.number}</b></td>
                    <td>{o.email}</td>
                    <td><span className={"pill " + o.status}>{o.status.replace("_", " ")}</span></td>
                    <td>{adminFmtDate(o.created_at)}</td>
                    <td className="num">{adminFmtMoney(o.total)}</td>
                    <td className="row-actions"><a href={"admin-orders.html?id=" + o.id}>View</a></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
        <div style={{marginTop:14}}><a href="admin-orders.html" className="btn-ghost">All orders ⟶</a></div>
      </div>

      <div className="form-grid">
        <div className="form-section">
          <h3>Quick <em>actions</em></h3>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            <a className="btn-solid" href="admin-product-edit.html">＋ Add a new product</a>
            <a className="btn-ghost"  href="admin-brand-edit.html">＋ Add a brand</a>
            <a className="btn-ghost"  href="admin-categories.html">Manage categories</a>
          </div>
        </div>
        <div className="form-section">
          <h3>Help</h3>
          <p style={{color:"var(--ink-2)",fontSize:13,lineHeight:1.6,margin:0}}>
            All catalogue changes go live instantly — no rebuild needed. Uploaded product images replace the default bottle illustration on the shop. Hide a product from the storefront by toggling <b>Active</b> off in the product editor.
          </p>
        </div>
      </div>
    </AdminShell>
  );
}

mountAdmin(Dashboard);
</script>
</body>
</html>
