<!doctype html>
<html lang="en" data-theme="ceylon">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Announcements — VITRINE Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="src/styles.css" />
<link rel="stylesheet" href="src/pages.css" />
<link rel="stylesheet" href="src/admin.css" />
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="src/api.jsx"></script>
<script type="text/babel" src="src/admin-shell.jsx"></script>

<script type="text/babel">
function AnnouncementsAdmin() {
  const [rows, setRows] = React.useState(null);
  const [text, setText] = React.useState("");
  const load = () => window.api.get("/api/admin/announcements").then(setRows);
  React.useEffect(load, []);

  const add = async (e) => {
    e.preventDefault();
    if (!text.trim()) return;
    await window.api.post("/api/admin/announcements", { text });
    setText(""); load();
  };
  const update = async (r, patch) => {
    await window.api.patch("/api/admin/announcements/" + r.id, patch);
    load();
  };
  const del = async (r) => {
    if (!adminConfirm("Delete this announcement?")) return;
    await window.api.del("/api/admin/announcements/" + r.id);
    load();
  };
  const move = async (r, dir) => {
    const list = [...rows];
    const i = list.findIndex(x => x.id === r.id);
    const j = i + dir;
    if (j < 0 || j >= list.length) return;
    await Promise.all([
      window.api.patch("/api/admin/announcements/" + list[i].id, { sort: list[j].sort }),
      window.api.patch("/api/admin/announcements/" + list[j].id, { sort: list[i].sort }),
    ]);
    load();
  };

  const sel = useBulkSelection(rows || [], "id");
  const bulkDelete = async () => {
    if (!adminConfirm(`Delete ${sel.count} announcement${sel.count === 1 ? "" : "s"}?`)) return;
    await adminBulkRun(Array.from(sel.selected), (id) => window.api.del("/api/admin/announcements/" + id));
    sel.clear(); load();
  };
  const bulkActive = async (active) => {
    await adminBulkRun(Array.from(sel.selected), (id) => window.api.patch("/api/admin/announcements/" + id, { active }));
    sel.clear(); load();
  };

  return (
    <AdminShell active="announcements" eyebrow="Top of every page" title={<>Announce<em>ments</em></>}>
      <section className="form-section">
        <h3>Add <em>new</em></h3>
        <form onSubmit={add} style={{display:"flex",gap:10}}>
          <input className="input" placeholder="e.g. Hand-wrapped gifting with every order" value={text} onChange={e => setText(e.target.value)} style={{flex:1}} />
          <button className="btn-solid">＋ Add</button>
        </form>
      </section>

      {rows === null ? <p>Loading…</p> :
       rows.length === 0 ? <div className="empty-admin"><h3>No announcements</h3></div> :
        <div className="dt-wrap">
          <table className="dt">
            <thead><tr>
              <th className="bulk-cell"><BulkCheckHeader allSelected={sel.allSelected} some={sel.some} onToggleAll={sel.toggleAll} /></th>
              <th></th><th>Text</th><th>Active</th><th></th>
            </tr></thead>
            <tbody>
              {rows.map((r, i) => (
                <tr key={r.id}>
                  <td className="bulk-cell"><input type="checkbox" checked={sel.selected.has(r.id)} onChange={() => sel.toggle(r.id)} /></td>
                  <td style={{width:80}}>
                    <button type="button" disabled={i===0} onClick={() => move(r, -1)} style={{padding:"3px 6px"}}>↑</button>
                    <button type="button" disabled={i===rows.length-1} onClick={() => move(r, +1)} style={{padding:"3px 6px"}}>↓</button>
                  </td>
                  <td><input className="input" defaultValue={r.text} onBlur={e => e.target.value !== r.text && update(r, { text: e.target.value })} /></td>
                  <td>
                    <button type="button" className={"chip-toggle" + (r.active ? " on" : "")} onClick={() => update(r, { active: !r.active })}>
                      {r.active ? "Active" : "Hidden"}
                    </button>
                  </td>
                  <td className="row-actions"><button className="danger" onClick={() => del(r)}>Delete</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>}

      <BulkBar count={sel.count} onClear={sel.clear}>
        <button type="button" onClick={() => bulkActive(true)}>Activate</button>
        <button type="button" onClick={() => bulkActive(false)}>Hide</button>
        <button type="button" className="danger" onClick={bulkDelete}>Delete</button>
      </BulkBar>
    </AdminShell>
  );
}

mountAdmin(AnnouncementsAdmin);
</script>
</body>
</html>
