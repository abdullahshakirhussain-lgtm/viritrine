<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<base href="/" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Back Room — VITRINE</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,200..500;1,6..72,200..400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="src/motion.css" />
<link rel="stylesheet" href="src/interactions.css" />
<style>
  html, body { margin: 0; }
  body { background: #FFFFFF; color: #101010; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  * { box-sizing: border-box; }
  .br-root a { color: #101010; text-decoration: none; }
  .br-root a.accent:hover { color: #5A1430; }
  .br-root ::selection { background: #5A1430; color: #fff; }
  .br-input { width: 100%; font-family: Newsreader, Georgia, serif; font-size: 16px; color: #101010; background: #FFFFFF; border: 1px solid #DCDCD6; padding: 12px 14px; outline: none; }
  .br-input:focus { border-color: #5A1430; }
  .br-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #6E6E68; display: block; margin-bottom: 7px; }
  .br-btn { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; background: #101010; color: #fff; border: none; padding: 15px 26px; cursor: pointer; transition: background .3s ease; }
  .br-btn:hover { background: #5A1430; }
  .br-btn[disabled] { opacity: .5; cursor: not-allowed; }
  .br-pill { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; padding: 4px 9px; border: 1px solid #DCDCD6; color: #6E6E68; }
  .br-pill.requested { border-color: #5A1430; color: #5A1430; }
  .br-pill.confirmed { border-color: #101010; color: #101010; background: #101010; color: #fff; }
  .br-pill.completed { color: #9A9A93; }
  .br-pill.cancelled { color: #B9B4AB; text-decoration: line-through; }
</style>
</head>
<body data-vit-cursor>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="src/api.js"></script>

<script src="src/init/backroom.js"></script>
<script type="module" src="src/motion.js"></script>
</body>
</html>
